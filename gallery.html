<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery | Group 1</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/layout.js"></script>
  <script src="js/members.js"></script>
  <script src="js/gallery.js"></script>
</head>
<body>
  <header id="site-header"></header>

  <main class="container">
    <h1>Gallery</h1>
    <p class="page-lead">Moments from our members, activities, projects and events.</p>

    <div id="gallery-filters" class="gallery-filters" role="group" aria-label="Filter photos"></div>
    <div id="gallery-grid" class="gallery-grid"></div>

    <dialog id="lightbox" class="lightbox" aria-label="Photo viewer">
      <button id="lightbox-close" class="lb-btn lb-close" type="button" aria-label="Close">&times;</button>
      <button id="lightbox-prev" class="lb-btn lb-prev" type="button" aria-label="Previous photo">&#10094;</button>
      <figure>
        <img id="lightbox-img" src="" alt="">
        <figcaption id="lightbox-caption"></figcaption>
      </figure>
      <button id="lightbox-next" class="lb-btn lb-next" type="button" aria-label="Next photo">&#10095;</button>
    </dialog>
  </main>

  <footer id="site-footer"></footer>
</body>
</html>
