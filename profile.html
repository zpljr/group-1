<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile | Group 1</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/layout.js"></script>
  <script src="js/members.js"></script>
  <script src="js/profile.js"></script>
</head>
<body>
  <header id="site-header"></header>

  <main class="container">
    <a class="back-link" href="index.html#members">&larr; Back to members</a>

    <article id="profile" class="profile">
      <div class="profile-side">
        <img id="profile-photo" src="images/placeholder.svg" alt="Member photo">
      </div>

      <div class="profile-body">
        <h1 id="profile-name">Full Name</h1>
        <p id="profile-role" class="profile-role"></p>

        <section>
          <h2>About Me</h2>
          <p id="profile-intro"></p>
        </section>

        <section>
          <h2>Hobbies &amp; Interests</h2>
          <ul id="profile-hobbies" class="tag-list"></ul>
        </section>

        <section>
          <h2>Skills &amp; Talents</h2>
          <ul id="profile-skills" class="tag-list"></ul>
        </section>

        <section>
          <h2>Other Information</h2>
          <dl id="profile-other" class="info-list"></dl>
        </section>
      </div>
    </article>
  </main>

  <footer id="site-footer"></footer>
</body>
</html>
